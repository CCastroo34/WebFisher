<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Página no encontrada | WebFisher</title>
<style>
  :root{
    --bg:#030609;
    --bg-panel:#0d1a17;
    --teal:#2dd4bf;
    --blue:#38bdf8;
    --text:#f5f7f6;
    --muted:#9ca8a5;
    --border:#152025;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(45,212,191,0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(56,189,248,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  a{color:inherit; text-decoration:none;}

  .wrap{max-width:520px;}

  .fish-icon{
    width:88px; height:88px;
    margin:0 auto 28px;
    border-radius:22px;
    background:rgba(45,212,191,0.12);
    border:1px solid rgba(45,212,191,0.35);
    display:flex; align-items:center; justify-content:center;
    color:var(--teal);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .code{
    font-size:72px;
    font-weight:800;
    letter-spacing:-2px;
    background:linear-gradient(135deg, var(--teal), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1;
    margin-bottom:12px;
  }
  h1{font-size:22px; margin-bottom:12px;}
  p{color:var(--muted); font-size:15px; line-height:1.6; margin-bottom:32px;}

  .actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn{
    padding:12px 24px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{
    background:var(--teal);
    color:#04201c;
    box-shadow:0 6px 20px rgba(45,212,191,0.25);
  }
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-outline{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn-outline:hover{border-color:var(--teal); color:var(--teal);}

  .ripples{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:-1;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="fish-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12C3 12 7 6 13 6C17 6 20 9 21 12C20 15 17 18 13 18C7 18 3 12 3 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9.5 10L9.5 9.2M9.5 14L9.5 14.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="code">404</div>
    <h1>¡Se escapó el pez!</h1>
    <p>Esta página no existe o se movió de lugar. Puede que el enlace esté roto, o que este pez simplemente nadó a otra parte.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11L12 3L21 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20H19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Volver al inicio
      </a>
      <a href="mailto:contact@webfiisher.com" class="btn btn-outline">Reportar un problema</a>
    </div>
  </div>

</body>
</html>
